apiVersion: v1
kind: Pod
metadata:
  name: quota-negative
spec:
  containers:
    - name: quota-negative
      image: python:3.11-slim
      resources:
        requests:
          cpu: "3"
          memory: 128Mi
        limits:
          cpu: "3"
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
