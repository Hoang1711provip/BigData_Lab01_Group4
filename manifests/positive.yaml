apiVersion: v1
kind: Pod
metadata:
  name: quota-positive
spec:
  containers:
    - name: quota-positive
      image: python:3.11-slim
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
